name: ForkCalendar
options:
  bundleIdPrefix: com.cwandt
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: false
targets:
  ForkCalendar:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: Fork Calendar
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.forkcalendar.mac
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: Fork Calendar
        CFBundleShortVersionString: "0.15.56"
        CFBundleVersion: "109"
        NSHumanReadableCopyright: © 2026 CW&T
        ATSApplicationFontsPath: .
    entitlements:
      path: Support/ForkCalendar-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
  ForkCalendar-iOS:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: Fork Calendar
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.forkcalendar.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: L6DVQR8JB9
        CODE_SIGN_STYLE: Automatic
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: Fork Calendar
        CFBundleShortVersionString: "0.15.56"
        CFBundleVersion: "109"
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Support/ForkCalendar-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cwandt.forkcalendar
    dependencies:
      - target: ForkCalendarWidgets
  ForkCalendarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sources/App/Theme.swift
      - Sources/App/WidgetShared.swift
      - Sources/Utilities/ColorUtils.swift
      - Sources/Utilities/DateUtils.swift
      - Sources/Fonts
    settings:
      base:
        PRODUCT_NAME: ForkCalendarWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.forkcalendar.app.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: L6DVQR8JB9
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
    info:
      path: Support/Info-Widgets.plist
      properties:
        CFBundleDisplayName: Fork Calendar
        CFBundleShortVersionString: "0.15.56"
        CFBundleVersion: "109"
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/ForkCalendarWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cwandt.forkcalendar
